[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-monty"
version = "2.1.0"
description = "Monty-backed code-interpreter middleware for LangChain agents"
readme = "README.md"
requires-python = ">=3.12"
# Runtime deps are deliberately deepagents-free: nothing in the middleware is
# deepagents-specific, so the package works with plain
# langchain.agents.create_agent. deepagents lives in the dev group below
# purely because the integration tests build agents with create_deep_agent.
# langgraph is declared explicitly (not just inherited via langchain) because
# the middleware imports GraphInterrupt and Command from it directly.
dependencies = [
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langgraph>=1.0.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.17",
    "python-dotenv>=1.2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "deepagents>=0.6.3",
    "langchain-openai>=1.2.2",
    "langchain-openrouter>=0.2.3",
    "langgraph-api>=0.10.0",
    "langgraph-cli>=0.4.29",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
    "langchain-tests==1.1.9"
]
