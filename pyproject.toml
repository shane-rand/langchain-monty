[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-monty"
version = "0.1.0"
description = "Monty-backed code-interpreter middleware for deepagents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.6.3",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "pydantic>=2.13.4",
    "pydantic-monty>=0.0.17",
]

[project.scripts]
langchain-monty = "langchain_monty:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.ruff.lint]
select = ["E", "F", "I"]


[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]
